# Prometheus configuration for local and Kubernetes deployments.
#
# The scrape targets below assume the docker-compose service names. In Kubernetes,
# replace the static_configs with the pod/service DNS names or, better, use the
# Prometheus Operator's ServiceMonitor and keep only the rule_files section here.
#
#   promtool check config deploy/observability/prometheus.yml
#
# Worker metrics matter as much as API metrics: `airline_outbox_pending_events`,
# `airline_outbox_lag_seconds` and `airline_read_model_lag_seconds` are written by the
# worker process, which exposes them on WORKER_METRICS_PORT (9464 here). Scraping only
# the API therefore leaves the outbox alerts permanently silent — Prometheus reports
# `absent()` rather than firing.

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    cluster: airline-local
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

# Uncomment once Alertmanager is deployed. Without it Prometheus still evaluates the
# rules and shows them as firing in the UI, which is enough for local verification.
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: airline-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: airline-workers
    metrics_path: /metrics
    static_configs:
      - targets: ["workers:9464"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Postgres/Citus and PgBouncer exporters are intentionally not configured here: they
  # need credentials and a deployment decision (one sidecar per node, or a central
  # exporter). When added, the useful dashboards are citus_* shard/placement metrics and
  # pgbouncer_pools_client_waiting_connections.
