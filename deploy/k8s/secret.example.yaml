# TEMPLATE ONLY — never apply this file with real values and never commit a filled-in
# copy. It exists to document the Secret's keys; a real secret is created by the
# deployment pipeline from its secret manager (Vault, AWS Secrets Manager, GSM) with:
#
#   kubectl -n airline create secret generic airline-secrets \
#     --from-literal=CITUS_COORDINATOR_URL='postgres://...' \
#     --from-literal=PGBOUNCER_URL='postgres://...' \
#     --from-literal=READMODEL_URL='postgres://...' \
#     --from-literal=REDIS_URL='rediss://...' \
#     --from-literal=JWT_ACCESS_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JWT_REFRESH_SECRET="$(openssl rand -base64 48)"
#
# Or with External Secrets Operator (preferred): point an ExternalSecret at the managed
# store and let it materialise `airline-secrets`; no credential ever passes through Git.
apiVersion: v1
kind: Secret
metadata:
  name: airline-secrets
  namespace: airline
  labels:
    app.kubernetes.io/part-of: airline-inventory
type: Opaque
stringData:
  CITUS_COORDINATOR_URL: "postgres://REPLACE_ME:REPLACE_ME@citus-coordinator.example.internal:5432/airline_inventory"
  PGBOUNCER_URL: "postgres://REPLACE_ME:REPLACE_ME@pgbouncer.example.internal:6432/airline_inventory"
  READMODEL_URL: "postgres://REPLACE_ME:REPLACE_ME@readmodel.example.internal:5432/airline_read"
  # Optional: search read replica. The projector still writes READMODEL_URL.
  # READMODEL_READ_URL: "postgres://REPLACE_ME:REPLACE_ME@readmodel-replica.example.internal:5432/airline_read"
  REDIS_URL: "rediss://:REPLACE_ME@redis.example.internal:6379"
  JWT_ACCESS_SECRET: "REPLACE_ME_WITH_AT_LEAST_32_RANDOM_BYTES"
  JWT_REFRESH_SECRET: "REPLACE_ME_WITH_AT_LEAST_32_RANDOM_BYTES"
