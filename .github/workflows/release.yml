# Release: build the runtime image once, push it to GHCR, and attach provenance.
#
# Triggered by an annotated tag (`v2.0.0`) or manually from a branch. The image is the
# only artifact this repository produces — the same image runs the API, the workers and
# the migration Job; the command differs, not the contents.
#
# Required repository settings:
#   - Actions → General → Workflow permissions: "Read and write permissions" (or rely on
#     the `permissions:` block below, which is sufficient for GHCR with GITHUB_TOKEN).
#   - The package must be linked to this repository the first time it is pushed.
#
# Deployment is deliberately not performed here. Migration is a separate Job (see
# deploy/k8s/migrate-job.yaml) because it must complete before the new image rolls out,
# and because a failed migration must stop a release rather than be retried by a
# pod restart loop.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 2.0.0-rc.1)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Distributed Airline Inventory
            org.opencontainers.image.description=Booking API and workers on distributed PostgreSQL (Citus)

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        run: |
          {
            echo "### Published image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo ""
            echo "Next: run the migration Job, then roll the Deployments:"
            echo ""
            echo '```'
            echo "kubectl -n airline delete job airline-migrate --ignore-not-found"
            echo "kubectl -n airline apply -f deploy/k8s/migrate-job.yaml"
            echo "kubectl -n airline wait --for=condition=complete job/airline-migrate --timeout=10m"
            echo "kubectl -n airline set image deployment/airline-api api=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo "kubectl -n airline set image deployment/airline-workers workers=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
